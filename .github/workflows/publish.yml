name: publish

# Triggered by pushing a v* tag (publishes all three registries) or
# manually via workflow_dispatch (target one registry — useful when
# one registry needs a re-publish but others are already done).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which registry to publish to"
        required: true
        default: "all"
        type: choice
        options: [all, pypi, npm, cargo]

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI (trusted publishing)
    if: github.event_name == 'push' || inputs.target == 'pypi' || inputs.target == 'all'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC -> trusted publisher
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      # sdist only for now. A platform-bare linux_x86_64 wheel is
      # rejected by PyPI (which requires manylinux* tags); proper
      # cross-platform wheels via cibuildwheel are a follow-up.
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  npm:
    name: npm
    if: github.event_name == 'push' || inputs.target == 'npm' || inputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm --provenance attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g tree-sitter-cli@0.25
      - run: tree-sitter generate
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cargo:
    name: crates.io
    if: github.event_name == 'push' || inputs.target == 'cargo' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
