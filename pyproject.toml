[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-sqlite3"
description = "Tree-sitter grammar for SQLite's SQL dialect plus dot-commands, faithful to upstream parse.y."
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "sqlite", "sql"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "df", email = "defin@users.noreply.github.com" },
]

[project.urls]
Homepage = "https://github.com/defin/tree-sitter-sqlite3"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
build-frontend = "build"

[tool.setuptools]
packages = ["tree_sitter_sqlite3"]
package-dir = { "tree_sitter_sqlite3" = "bindings/python/tree_sitter_sqlite3" }

[tool.setuptools.package-data]
tree_sitter_sqlite3 = ["*.pyi", "py.typed"]
